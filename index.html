<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7b6c8" />
  <title>花丸札</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf8;
      --ink: #3d2b2d;
      --muted: #806f71;
      --line: #ead7c9;
      --accent: #f08dac;
      --accent-strong: #db5d82;
      --accent-soft: #ffe2eb;
      --gold: #f7c948;
      --done: #e8e1dc;
      --shadow: 0 8px 20px rgba(117, 76, 52, .10);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16px 16px, rgba(240, 141, 172, .13) 0 2px, transparent 3px),
        linear-gradient(180deg, #fff8ef 0%, #fff1e6 54%, #fff7ef 100%);
      background-size: 34px 34px, auto;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", sans-serif;
      line-height: 1.38;
      -webkit-text-size-adjust: 100%;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    .app { width: min(940px, 100%); margin: 0 auto; padding: 8px 8px calc(70px + var(--safe-bottom)); }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -8px -8px 8px;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 7px;
      background: rgba(255, 247, 239, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(234, 215, 201, .70);
    }

    .title-row, .row, .top-tools { display: flex; align-items: center; gap: 6px; }
    .title-row { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }

    h1 { margin: 0; font-size: 21px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    h2 { margin: 0; font-size: 17px; }
    h3 { margin: 10px 0 7px; font-size: 13px; color: var(--muted); }
    label { font-size: 13px; color: var(--muted); font-weight: 850; }

    .head-actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .stamp-total { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 7px 10px; min-height: 38px; border-radius: 999px; background: var(--paper); box-shadow: var(--shadow); font-weight: 900; white-space: nowrap; }
    .stamp-total b { color: var(--accent-strong); font-size: 18px; }
    .consume-top { flex: 0 0 auto; min-height: 40px; padding: 8px 10px; border-radius: 16px; background: #fff; border: 1px solid var(--line); font-weight: 950; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
    .convert-top { flex: 0 0 auto; min-height: 40px; padding: 8px 13px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 950; white-space: nowrap; box-shadow: 0 8px 20px rgba(219, 93, 130, .22); }
    .convert-top:disabled { opacity: .62; }

    .top-strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; margin-top: 7px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar, .top-tools::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 7px 11px; min-height: 36px; border-radius: 999px; background: rgba(255, 253, 248, .78); border: 1px solid var(--line); color: var(--muted); font-weight: 750; white-space: nowrap; }
    .tab.active { background: var(--accent-soft); border-color: rgba(219, 93, 130, .38); color: var(--ink); font-weight: 900; }
    .top-tools { justify-content: flex-end; overflow-x: auto; scrollbar-width: none; }
    .tool-btn { flex: 0 0 auto; min-height: 34px; padding: 6px 9px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 13px; font-weight: 850; white-space: nowrap; }
    .icon-tool { min-width: 44px; font-size: 21px; line-height: 1; padding: 5px 8px; }

    .card { background: rgba(255, 253, 248, .94); border: 1px solid rgba(234, 215, 201, .86); border-radius: 17px; box-shadow: var(--shadow); padding: 8px; margin-bottom: 8px; }
    .list-card { padding: 7px; }
    .subtext { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .controls { display: grid; gap: 8px; }

    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 10px 11px; min-height: 42px; outline: none; }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: rgba(219, 93, 130, .55); box-shadow: 0 0 0 3px rgba(240, 141, 172, .16); }

    .btn { min-height: 42px; padding: 9px 12px; border-radius: 13px; background: #fff; border: 1px solid var(--line); color: var(--ink); font-weight: 800; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.gold { background: #ffef9b; border-color: #f3d45a; color: #6d4d00; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.danger { color: #a94848; border-color: #f0c1c1; background: #fff6f6; }
    .btn.small { min-height: 34px; padding: 6px 9px; border-radius: 11px; font-size: 13px; }
    .btn:disabled { opacity: .52; cursor: default; }

    .task-list { display: grid; gap: 6px; width: 100%; }
    .task { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 9px 9px 9px 11px; min-height: 56px; border-radius: 15px; border: 1px solid var(--line); background: linear-gradient(180deg, #fffefb, #fff8ed); box-shadow: 0 4px 10px rgba(117, 76, 52, .05); transition: transform .12s ease, opacity .12s ease, background .12s ease; }
    .task:active { transform: scale(.99); }
    .task.done { background: var(--done); opacity: .72; }
    .task.recommended:not(.done) { border-color: rgba(247, 201, 72, .78); background: linear-gradient(180deg, #fffbe8, #fff8ed); }
    .task:has(.task-due) { border-color: rgba(219, 93, 130, .62); background: linear-gradient(180deg, #fff4f7, #fff8ed); }
    .task-title { font-weight: 900; font-size: 16px; line-height: 1.28; overflow-wrap: anywhere; }
    .task.done .task-title { text-decoration: line-through; }
    .task-due { color: #c14667; font-size: 12px; font-weight: 850; margin-top: 2px; line-height: 1.15; }
    .task-start { color: #6d5f91; font-size: 12px; font-weight: 850; margin-top: 2px; line-height: 1.15; }
    .task-menu { display: flex; gap: 5px; align-items: center; }
    .task-menu .btn { min-width: 42px; }

    details { border: 1px dashed var(--line); border-radius: 15px; padding: 8px 9px; background: rgba(255,255,255,.42); margin-top: 6px; }
    summary { cursor: pointer; color: var(--muted); font-weight: 850; font-size: 13px; }
    #dueTasks:not(:empty) + #anytimeVisible:not(:empty) { margin-top: 12px; }
    #futureWrap { margin-top: 8px; }
    .done-divider { height: 1px; background: var(--line); margin: 7px 0; }
    .empty { padding: 14px 10px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 15px; background: rgba(255,255,255,.42); font-size: 13px; }
    .page.hidden, .hidden { display: none !important; }

    .form-head, .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; padding: 7px 8px calc(8px + var(--safe-bottom)); background: rgba(255, 247, 239, .92); border-top: 1px solid rgba(234, 215, 201, .74); backdrop-filter: blur(14px); }
    .bottom-inner { width: min(940px, 100%); margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 7px; align-items: center; }
    .bottom-add { font-size: 26px; font-weight: 950; min-height: 54px; }
    .bottom-ai { min-width: 74px; font-size: 21px; font-weight: 950; min-height: 54px; background: #fff; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(51, 36, 38, .35); display: none; padding: 14px 8px calc(14px + var(--safe-bottom)); overflow: auto; }
    .modal-backdrop.show { display: block; }
    .modal { width: min(720px, 100%); margin: 0 auto; background: var(--paper); border-radius: 20px; padding: 12px; box-shadow: 0 18px 46px rgba(0,0,0,.24); }
    .splitline { height: 1px; background: var(--line); margin: 10px 0; }
    .confirm-list { display: grid; gap: 7px; margin: 10px 0; max-height: 45vh; overflow: auto; }
    .confirm-item { padding: 9px 10px; border-radius: 13px; border: 1px solid var(--line); background: #fff; font-weight: 800; }
    .achievement-card { background: linear-gradient(180deg, #fff8fb, #fffdf8); }
    .achievement-tree { font-size: 32px; line-height: 1.1; margin-bottom: 8px; }
    .reward-log .task-title { color: #a16207; }

    .toast { position: fixed; left: 10px; right: 10px; bottom: calc(72px + var(--safe-bottom)); z-index: 30; max-width: 560px; margin: 0 auto; padding: 11px 13px; border-radius: 16px; background: rgba(61, 43, 45, .92); color: #fff; box-shadow: 0 10px 28px rgba(0,0,0,.22); display: none; }
    .toast.show { display: block; }
    .stamp-pop { position: fixed; inset: 0; z-index: 25; display: none; place-items: center; pointer-events: none; background: rgba(255, 247, 239, .18); }
    .stamp-pop.show { display: grid; animation: fadeOut .9s ease forwards; }
    .stamp-pop span { display: inline-grid; place-items: center; width: 152px; height: 152px; border-radius: 50%; border: 8px solid #e94b70; color: #e94b70; background: rgba(255,255,255,.82); font-size: 34px; font-weight: 1000; transform: rotate(-12deg); box-shadow: 0 12px 30px rgba(164, 60, 90, .22); animation: stampIn .42s cubic-bezier(.15, 1.2, .35, 1) both; }
    @keyframes stampIn { from { transform: scale(2.4) rotate(-18deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }
    @keyframes fadeOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
    @media (max-width: 390px) { h1 { font-size: 19px; } .stamp-total { padding: 6px 8px; } .consume-top { padding: 8px 8px; } .convert-top { padding: 8px 10px; } .tool-btn { padding: 6px 8px; } .task-title { font-size: 15px; } .bottom-ai { min-width: 70px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1><span aria-hidden="true">🌸</span><span>花丸札</span></h1>
        <div class="head-actions">
          <button class="stamp-total" id="openSettings" type="button" aria-label="設定を開く">花丸 <b id="stampTotal">0</b></button>
          <a class="consume-top" id="consumeLink" href="consume.html">消費</a>
          <button class="convert-top" id="convertBtn" type="button">変換</button>
        </div>
      </div>
      <div class="top-strip">
        <div class="tabs" id="categoryTabs" aria-label="カテゴリ"></div>
        <div class="top-tools">
          <button class="tool-btn icon-tool" id="refreshReco" type="button" aria-label="おすすめ更新">🔄</button>
          <button class="tool-btn icon-tool" id="undoBtn" type="button" aria-label="Undo" disabled>↩️</button>
          <button class="tool-btn" id="openHistory" type="button">履歴</button>
        </div>
      </div>
    </header>

    <main id="listPage" class="page">
      <section class="card list-card">
        <div class="task-list" id="dueTasks"></div>
        <div class="task-list" id="anytimeVisible"></div>
        <details id="foldedWrap" class="hidden">
          <summary id="foldedSummary">残りの札</summary>
          <div class="task-list" id="anytimeFolded" style="margin-top:6px"></div>
        </details>
        <details id="futureWrap" class="hidden">
          <summary id="futureSummary">開始待ち</summary>
          <div class="task-list" id="futureTasks" style="margin-top:6px"></div>
        </details>
        <div id="doneDivider" class="done-divider hidden"></div>
        <div class="task-list" id="doneTasks"></div>
        <div id="emptyState" class="empty hidden">札なし。脳内に貼りっぱなしのやつを一枚剥がしてよい。</div>
      </section>
    </main>

    <main id="editPage" class="page hidden">
      <section class="card">
        <div class="form-head">
          <div>
            <h2 id="formTitle">札を貼る</h2>
            <p class="subtext">登録と編集。</p>
          </div>
          <button class="btn ghost" id="cancelEdit" type="button">戻る</button>
        </div>
        <form class="controls" id="taskForm">
          <input id="taskId" type="hidden" />
          <input id="monthlyScheduleId" type="hidden" />
          <label>札の名前</label>
          <input id="taskTitle" type="text" placeholder="例：キーケースのお金補充" autocomplete="off" required />
          <label>カテゴリ</label>
          <select id="taskCategory"></select>
          <div id="startFields" class="controls">
          <label>開始</label>
          <div class="row wrap">
            <select id="startKind" class="grow" aria-label="開始">
              <option value="now">今から</option>
              <option value="dated">開始日あり</option>
            </select>
            <input id="startDate" class="grow hidden" type="date" aria-label="開始日" />
          </div>
          </div>
          <label>種類</label>
          <select id="taskKind">
            <option value="single">単発系</option>
            <option value="repeat">定期（完了日から数える）</option>
            <option value="monthly">月次（毎月別の札）</option>
          </select>
          <div id="repeatFields" class="row wrap hidden">
            <input id="repeatInterval" class="grow" type="number" min="1" max="999" inputmode="numeric" aria-label="繰り返し間隔" />
            <select id="repeatEvery" class="grow" aria-label="繰り返し単位">
              <option value="day">日後</option>
              <option value="week">週間後</option>
              <option value="month">か月後</option>
              <option value="year">年後</option>
            </select>
          </div>
          <div id="monthlyFields" class="controls hidden">
            <label for="monthlyDay">毎月何日から発生するか</label>
            <input id="monthlyDay" type="number" min="1" max="31" value="1" inputmode="numeric" />
            <label for="monthlyOffset">何月分の札にするか</label>
            <select id="monthlyOffset">
              <option value="0">当月分</option>
              <option value="-1">前月分（例：８月に７月分を発生）</option>
            </select>
            <label for="monthlyStart">この日以降から発生させる</label>
            <input id="monthlyStart" type="date" />
            <p class="subtext">名前は「家計簿登録」のように月を除いて入力。年と月は自動で付く。指定日がない月は月末に発生する。</p>
            <p class="subtext" id="monthlyEditHint">同じ月次札の未完了分と今後の設定を編集する。発生停止は設定から。</p>
          </div>
          <div id="dueFields" class="controls">
          <label>期限</label>
          <div class="row wrap">
            <select id="dueKind" class="grow" aria-label="期限">
              <option value="anytime">いつでも</option>
              <option value="dated">期限あり</option>
            </select>
            <input id="dueDate" class="grow hidden" type="date" aria-label="期限日" />
          </div>
          </div>
          <button class="btn primary" type="submit">保存</button>
          <button class="btn hidden" id="reviveFromEdit" type="button">今すぐ復活</button>
          <p class="subtext hidden" id="reviveHint">前回の花丸を残して未完了に戻す。次回は今回の完了日から数える。</p>
          <button class="btn danger hidden" id="deleteFromEdit" type="button">この札を削除</button>
        </form>
      </section>
    </main>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-inner">
      <button class="btn gold bottom-add" id="newTaskBtn" type="button">札を貼る</button>
      <button class="btn bottom-ai" id="openAiTools" type="button">AI</button>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="settingsTitle">設定とバックアップ</h2>
        <button class="btn small ghost" data-close="settingsModal" type="button">閉じる</button>
      </div>
      <div class="controls">
        <label>カテゴリ追加</label>
        <div class="row">
          <input id="categoryInput" class="grow" type="text" placeholder="例：生活" />
          <button class="btn" id="addCategory" type="button">追加</button>
        </div>
        <div class="row wrap" id="categoryManage"></div>
        <label>いつでも札の表示数</label>
        <input id="visibleLimit" type="number" min="1" max="99" inputmode="numeric" />
        <label>おすすめ数</label>
        <input id="recommendCount" type="number" min="0" max="20" inputmode="numeric" />
        <label>日課リセット時刻</label>
        <input id="resetHour" type="time" />
        <button class="btn primary" id="saveSettings" type="button">設定保存</button>
        <div class="splitline"></div>
        <h3>月次札の設定</h3>
        <div id="monthlyScheduleList" class="controls"></div>
        <div class="splitline"></div>
        <p class="subtext">花丸札 v19</p>
        <label>JSONバックアップ</label>
        <button class="btn" id="exportJson" type="button">書き出し</button>
        <textarea id="jsonBox" placeholder="ここにJSONを貼って読み込み"></textarea>
        <div class="row wrap">
          <button class="btn" id="copyJson" type="button">JSONコピー</button>
          <button class="btn danger" id="importJson" type="button">読み込み</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="outputModal" role="dialog" aria-modal="true" aria-labelledby="outputTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="outputTitle">花丸にした札</h2>
        <button class="btn small ghost" data-close="outputModal" type="button">閉じる</button>
      </div>
      <p class="subtext" id="convertSummary"></p>
      <label>出力テンプレート</label>
      <textarea id="templateBox"></textarea>
      <div class="row wrap">
        <button class="btn" id="saveTemplate" type="button">テンプレ保存</button>
        <button class="btn primary" id="copyOutput" type="button">出力文コピー</button>
      </div>
      <label>出力文</label>
      <textarea id="outputBox"></textarea>
      <div class="splitline"></div>
      <h3>直近の花丸変換履歴</h3>
      <div id="historyInOutput" class="controls"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="historyTitle">花丸履歴</h2>
        <button class="btn small ghost" data-close="historyModal" type="button">閉じる</button>
      </div>
      <div id="historyList" class="controls"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="aiModal" role="dialog" aria-modal="true" aria-labelledby="aiTitle">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 id="aiTitle">AIコピペ連携</h2>
          <p class="subtext">APIキーは使わない。貼る・持ち帰るだけ。</p>
        </div>
        <button class="btn small ghost" data-close="aiModal" type="button">閉じる</button>
      </div>
      <div class="controls">
        <label>細分化してほしい札</label>
        <input id="aiSourceTask" type="text" placeholder="例：洗面所をなんとかする" />
        <label>AI依頼文</label>
        <textarea id="aiPromptBox"></textarea>
        <div class="row wrap">
          <button class="btn" id="makeAiPrompt" type="button">依頼文生成</button>
          <button class="btn primary" id="copyAiPrompt" type="button">依頼文コピー</button>
        </div>
        <div class="splitline"></div>
        <label>AI整形結果を貼る</label>
        <textarea id="aiImportBox" placeholder="[生活][単発][いつでも] キーケースのお金補充&#10;[生活][単発][開始日:2026-06-01][いつでも] 6月以降の札&#10;[生活][繰り返し:3日][いつでも] 洗面台だけ掃除"></textarea>
        <div class="row wrap">
          <button class="btn" id="parseAiTasks" type="button">取り込み確認</button>
          <button class="btn primary" id="importAiTasks" type="button">札として貼る</button>
        </div>
        <div id="aiParseResult" class="empty">タグ形式の結果をここで確認。</div>
      </div>
    </div>
  </div>

  <div class="stamp-pop" id="stampPop" aria-hidden="true"><span>花丸</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./recurrence.js?v=16"></script>
  <script>
    const STORAGE_KEY = 'hanamaru-fuda-v2';
    const OLD_STORAGE_KEY = 'hanamaru-fuda-v1';
    const DEFAULT_TEMPLATE = `花丸に変換した札：\n{{items}}\n\n花丸 +{{count}} / 現在 {{total}}`;
    const $ = (id) => document.getElementById(id);
    const state = loadState();
    let currentCategory = state.categories[0] || '生活';
    let lastUndo = null;
    let lastConvertedItems = [];
    let renderedDay = '';

    function defaultState() {
      return {
        version: 4,
        monthlySchedules: [],
        categories: ['生活', '創作'],
        tasks: [],
        totalStamps: 0,
        earnedTotal: 0,
        settings: { visibleLimit: 5, recommendCount: 3, resetHour: '05:00', outputTemplate: DEFAULT_TEMPLATE },
        recommendations: {},
        conversionHistory: [],
        rewardHistory: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_STORAGE_KEY);
        if (!raw) return defaultState();
        const source = JSON.parse(raw);
        const parsed = normalizeState(source);
        // A full storage area must never turn valid existing data into an empty state.
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (error) { console.warn(error); }
        try {
          if ((Number(source.version) || 0) < 4 && !localStorage.getItem('hanamaru-before-v16')) localStorage.setItem('hanamaru-before-v16', raw);
        } catch (error) { console.warn('Migration backup could not be saved.', error); }
        return parsed;
      } catch (error) {
        console.warn(error);
        return defaultState();
      }
    }

    function normalizeState(input) {
      const base = defaultState();
      const merged = { ...base, ...input, settings: { ...base.settings, ...(input && input.settings ? input.settings : {}) } };
      merged.version = 4;
      merged.monthlySchedules = Array.isArray(merged.monthlySchedules) ? merged.monthlySchedules.map(s => HanamaruRecurrence.normalizeSchedule(s, todayISO())).filter(Boolean) : [];
      merged.categories = Array.isArray(merged.categories) && merged.categories.length ? uniqueClean(merged.categories) : base.categories;
      merged.tasks = Array.isArray(merged.tasks) ? merged.tasks.map(normalizeTask).filter(Boolean) : [];
      merged.totalStamps = Number.isFinite(Number(merged.totalStamps)) ? Number(merged.totalStamps) : 0;
      merged.rewardHistory = Array.isArray(merged.rewardHistory) ? merged.rewardHistory.slice(0, 20) : [];
      const spentTotal = merged.rewardHistory.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
      merged.earnedTotal = Math.max(Number(merged.earnedTotal) || 0, merged.totalStamps + spentTotal);
      merged.recommendations = merged.recommendations && typeof merged.recommendations === 'object' ? merged.recommendations : {};
      merged.conversionHistory = Array.isArray(merged.conversionHistory) ? merged.conversionHistory.slice(0, 3) : [];
      return merged;
    }

    function normalizeTask(task) {
      if (!task || !String(task.title || '').trim()) return null;
      const kind = task.kind === 'repeat' ? 'repeat' : 'single';
      const repeatEvery = ['day','week','month','year'].includes(task.repeatEvery) ? task.repeatEvery : 'day';
      const repeatInterval = Math.max(1, Number(task.repeatInterval) || 1);
      const startKind = task.startKind === 'dated' ? 'dated' : 'now';
      const startDate = startKind === 'dated' ? (task.startDate || todayISO()) : '';
      const dueKind = task.dueKind === 'dated' ? 'dated' : 'anytime';
      const dueDate = dueKind === 'dated' ? (task.dueDate || todayISO()) : '';
      return {
        id: task.id || makeId(),
        title: String(task.title).trim(),
        category: task.category || '生活',
        kind,
        repeatEvery,
        repeatInterval,
        repeatSchema: task.repeatSchema || 0,
        repeatCycle: task.repeatCycle || 0,
        nextOccurrenceDate: task.nextOccurrenceDate || '',
        repeatArchive: Boolean(task.repeatArchive),
        monthlyScheduleId: task.monthlyScheduleId || '',
        occurrenceMonth: task.occurrenceMonth || '',
        startKind,
        startDate,
        dueKind,
        dueDate,
        dueAnchor: buildDueAnchor(dueDate, task.dueAnchor),
        completed: Boolean(task.completed),
        completedAt: task.completedAt || null,
        stampedPeriods: task.stampedPeriods && typeof task.stampedPeriods === 'object' ? task.stampedPeriods : {},
        activePeriodKey: task.activePeriodKey || null,
        createdAt: task.createdAt || new Date().toISOString(),
        sortOrder: Math.floor(Number(task.sortOrder) || 0)
      };
    }

    function buildDueAnchor(dueDate, existing) {
      if (existing && typeof existing === 'object') return existing;
      if (!dueDate) return { day: null, endOfMonth: false };
      const d = parseISODate(dueDate);
      return { day: d.getDate(), endOfMonth: d.getDate() === lastDayOfMonth(d.getFullYear(), d.getMonth()) };
    }

    function uniqueClean(values) { return [...new Set(values.map(v => String(v).trim()).filter(Boolean))]; }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function makeId() { return `t_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }

    function nowShiftedDate() {
      const [h, m] = (state.settings.resetHour || '05:00').split(':').map(Number);
      const d = new Date();
      d.setHours(d.getHours() - (Number.isFinite(h) ? h : 5));
      d.setMinutes(d.getMinutes() - (Number.isFinite(m) ? m : 0));
      return d;
    }

    function todayISO(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISODate(value) {
      const [y, m, d] = String(value).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function isFutureTask(task) {
      return task.startKind === 'dated' && task.startDate && task.startDate > todayISO(nowShiftedDate());
    }

    function dayOrdinal(date) { return Math.floor(new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime() / 86400000); }
    function monthOrdinal(date) { return date.getFullYear() * 12 + date.getMonth(); }
    function lastDayOfMonth(year, monthIndex) { return new Date(year, monthIndex + 1, 0).getDate(); }

    function periodKey(task) {
      return task.activePeriodKey || `completion:${task.id}:${task.repeatCycle || 0}`;
    }


    function currentDayKey() { return `day:1:${Math.floor(dayOrdinal(nowShiftedDate()))}`; }

    function applyRepeatReset() {
      const today = todayISO(nowShiftedDate());
      HanamaruRecurrence.advanceRepeats(state, today, makeId);
      HanamaruRecurrence.generateMonthly(state, today, normalizeTask);
    }

    function showPage(name) {
      $('listPage').classList.toggle('hidden', name !== 'list');
      $('editPage').classList.toggle('hidden', name !== 'edit');
      $('bottomBar').classList.toggle('hidden', name !== 'list');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function render() {
      applyRepeatReset();
      renderedDay = currentDayKey();
      if (!state.categories.includes(currentCategory)) currentCategory = state.categories[0];
      $('stampTotal').textContent = state.totalStamps;
      renderTabs();
      renderCategorySelect();
      renderSettingsManage();
      renderMonthlySchedules();
      renderTasks();
      save();
    }

    function renderTabs() {
      const tabs = $('categoryTabs');
      tabs.innerHTML = '';
      state.categories.forEach(category => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab ${category === currentCategory ? 'active' : ''}`;
        btn.textContent = category;
        btn.addEventListener('click', () => { currentCategory = category; render(); });
        tabs.appendChild(btn);
      });
    }

    function renderCategorySelect() {
      const select = $('taskCategory');
      select.innerHTML = '';
      state.categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
    }

    function renderTasks() {
      const tasks = state.tasks.filter(t => t.category === currentCategory);
      const future = sortTasks(tasks.filter(t => !t.completed && isFutureTask(t)));
      const active = tasks.filter(t => !t.completed && !isFutureTask(t));
      const done = tasks.filter(t => t.completed);
      const due = sortTasks(active.filter(t => t.dueKind === 'dated'));
      const anytime = sortTasks(active.filter(t => t.dueKind !== 'dated'));
      const recommendedIds = new Set(getRecommendationIds());
      const visibleLimit = Math.max(1, Number(state.settings.visibleLimit) || 5);
      const visibleAnytime = anytime.slice(0, visibleLimit);
      const foldedAnytime = anytime.slice(visibleLimit);
      renderTaskList($('dueTasks'), due, recommendedIds);
      renderTaskList($('anytimeVisible'), visibleAnytime, recommendedIds);
      renderTaskList($('anytimeFolded'), foldedAnytime, recommendedIds);
      renderTaskList($('futureTasks'), future, recommendedIds);
      renderTaskList($('doneTasks'), sortTasks(done, true), recommendedIds);
      $('foldedWrap').classList.toggle('hidden', foldedAnytime.length === 0);
      $('foldedSummary').textContent = `残りの札 ${foldedAnytime.length}枚`;
      $('futureWrap').classList.toggle('hidden', future.length === 0);
      $('futureSummary').textContent = `開始待ち ${future.length}枚`;
      $('doneDivider').classList.toggle('hidden', done.length === 0 || (due.length + visibleAnytime.length + foldedAnytime.length + future.length === 0));
      $('emptyState').classList.toggle('hidden', tasks.length !== 0);
      updateConvertButton();
    }

    function sortTasks(tasks, done = false) {
      return [...tasks].sort((a, b) => {
        if (!done && isFutureTask(a) && isFutureTask(b)) return String(a.startDate).localeCompare(String(b.startDate));
        if (!done && a.dueKind === 'dated' && b.dueKind === 'dated') return String(a.dueDate).localeCompare(String(b.dueDate));
        if (!done && a.dueKind !== 'dated' && b.dueKind !== 'dated') {
          const manual = (Number(b.sortOrder) || 0) - (Number(a.sortOrder) || 0);
          if (manual !== 0) return manual;
        }
        if (done) return String(b.completedAt || '').localeCompare(String(a.completedAt || ''));
        return String(a.createdAt).localeCompare(String(b.createdAt));
      });
    }

    function renderTaskList(container, tasks, recommendedIds) {
      container.innerHTML = '';
      tasks.forEach(task => container.appendChild(taskElement(task, recommendedIds.has(task.id))));
    }

    function taskElement(task, recommended) {
      const el = document.createElement('article');
      el.className = `task ${task.completed ? 'done' : ''} ${recommended ? 'recommended' : ''}`;
      const main = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = task.title;
      main.appendChild(title);
      if (task.dueKind === 'dated') {
        const due = document.createElement('div');
        due.className = 'task-due';
        due.textContent = `期限 ${task.dueDate}`;
        main.appendChild(due);
      }
      if (isFutureTask(task)) {
        const start = document.createElement('div');
        start.className = 'task-start';
        start.textContent = `開始 ${task.startDate}`;
        main.appendChild(start);
      }
      if (task.kind === 'repeat') {
        const info = document.createElement('div');
        info.className = 'subtext';
        info.textContent = task.completed && task.nextOccurrenceDate ? `次回 ${task.nextOccurrenceDate}から` : repeatHuman(task);
        main.appendChild(info);
      }
      const menu = document.createElement('div');
      menu.className = 'task-menu';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'btn small';
      edit.textContent = '編集';
      edit.addEventListener('click', () => openTaskForm(task.id));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn small ghost';
      del.textContent = '×';
      del.setAttribute('aria-label', '削除');
      del.addEventListener('click', () => deleteTask(task.id));
      menu.append(edit, del);
      el.append(main, menu);
      el.addEventListener('click', (event) => { if (!event.target.closest('button')) toggleTask(task.id); });
      return el;
    }

    function getRecommendationIds() {
      const key = `${currentCategory}:${currentDayKey()}`;
      const activeAnytimeIds = state.tasks.filter(t => t.category === currentCategory && !t.completed && !isFutureTask(t) && t.dueKind === 'anytime').map(t => t.id);
      const existing = state.recommendations[key];
      if (Array.isArray(existing) && existing.some(id => activeAnytimeIds.includes(id))) return existing.filter(id => activeAnytimeIds.includes(id));
      return refreshRecommendations(false);
    }

    function refreshRecommendations(shouldRender = true) {
      const key = `${currentCategory}:${currentDayKey()}`;
      const count = Math.max(0, Number(state.settings.recommendCount) || 0);
      const ids = shuffle(state.tasks.filter(t => t.category === currentCategory && !t.completed && !isFutureTask(t) && t.dueKind === 'anytime').map(t => t.id)).slice(0, count);
      state.recommendations[key] = ids;
      save();
      if (shouldRender) { render(); toast('おすすめを入れ替えた。'); }
      return ids;
    }

    function shuffle(items) {
      const array = [...items];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function openTaskForm(id = '', scheduleId = '') {
      const task = id ? state.tasks.find(t => t.id === id) : null;
      const schedule = state.monthlySchedules.find(s => s.id === (scheduleId || task?.monthlyScheduleId));
      $('formTitle').textContent = schedule ? '月次札の設定' : task ? '札を編集' : '札を貼る';
      $('taskId').value = task ? task.id : '';
      $('monthlyScheduleId').value = schedule ? schedule.id : '';
      $('taskTitle').value = schedule ? schedule.title : task ? task.title : '';
      $('taskCategory').value = schedule ? schedule.category : task ? task.category : currentCategory;
      $('startKind').value = task ? (task.startKind || 'now') : 'now';
      $('startDate').value = task && task.startDate ? task.startDate : todayISO();
      $('taskKind').value = schedule ? 'monthly' : task ? task.kind : 'single';
      $('taskKind').disabled = Boolean(schedule);
      $('repeatInterval').value = task ? task.repeatInterval : 1;
      $('repeatEvery').value = task ? task.repeatEvery : 'day';
      $('dueKind').value = task ? task.dueKind : 'anytime';
      $('dueDate').value = task && task.dueDate ? task.dueDate : todayISO();
      $('monthlyDay').value = schedule ? schedule.day : 1;
      $('monthlyOffset').value = schedule ? schedule.monthOffset : 0;
      $('monthlyStart').value = schedule ? schedule.startDate : task?.dueDate || task?.startDate || todayISO().slice(0, 7) + '-01';
      $('monthlyStart').disabled = Boolean(schedule);
      $('monthlyEditHint').classList.toggle('hidden', !schedule);
      $('deleteFromEdit').classList.toggle('hidden', !task && !schedule);
      $('deleteFromEdit').textContent = schedule ? 'この月次設定を削除' : 'この札を削除';
      const canRevive = Boolean(task && !schedule && task.kind === 'repeat' && (task.completed || isFutureTask(task)));
      $('reviveFromEdit').classList.toggle('hidden', !canRevive);
      $('reviveHint').classList.toggle('hidden', !canRevive);
      syncFormVisibility();
      showPage('edit');
    }


    function syncFormVisibility() {
      const monthly = $('taskKind').value === 'monthly';
      $('repeatFields').classList.toggle('hidden', $('taskKind').value !== 'repeat');
      $('monthlyFields').classList.toggle('hidden', !monthly);
      $('startFields').classList.toggle('hidden', monthly);
      $('dueFields').classList.toggle('hidden', monthly);
      $('startDate').classList.toggle('hidden', $('startKind').value !== 'dated');
      $('dueDate').classList.toggle('hidden', $('dueKind').value !== 'dated');
      $('monthlyStart').required = monthly;
    }


    function saveTaskFromForm(event) {
      event.preventDefault();
      const id = $('taskId').value;
      const title = $('taskTitle').value.trim();
      if (!title) return;
      if ($('taskKind').value === 'monthly') { saveMonthlyFromForm(id, title); return; }
      const index = state.tasks.findIndex(t => t.id === id);
      const old = index >= 0 ? state.tasks[index] : null;
      const data = normalizeTask({
        ...(old || {}), id: id || makeId(), title,
        category: $('taskCategory').value || currentCategory,
        startKind: $('startKind').value,
        startDate: $('startKind').value === 'dated' ? ($('startDate').value || todayISO()) : '',
        kind: $('taskKind').value,
        repeatInterval: $('repeatInterval').value,
        repeatEvery: $('repeatEvery').value,
        dueKind: $('dueKind').value,
        dueDate: $('dueKind').value === 'dated' ? ($('dueDate').value || todayISO()) : ''
      });
      data.sortOrder = data.dueKind === 'anytime' ? Date.now() : (old?.sortOrder || 0);
      data.repeatSchema = 1;
      data.activePeriodKey = periodKey(data);
      if (data.kind === 'repeat' && data.completed && data.completedAt) {
        data.nextOccurrenceDate = HanamaruRecurrence.nextDate(todayISO(new Date(data.completedAt)), data);
      }
      if (old && data.kind !== old.kind) {
        data.completed = false;
        data.completedAt = null;
        data.nextOccurrenceDate = '';
        data.stampedPeriods = {};
        data.repeatCycle += 1;
        data.activePeriodKey = `completion:${data.id}:${data.repeatCycle}`;
      }
      if (index >= 0) state.tasks[index] = data; else state.tasks.push(data);
      currentCategory = data.category;
      save();
      showPage('list');
      render();
      toast(index >= 0 ? '札を編集した。' : '札を貼った。');
    }

    function saveMonthlyFromForm(taskId, title) {
      const scheduleId = $('monthlyScheduleId').value;
      let schedule = state.monthlySchedules.find(s => s.id === scheduleId);
      const old = state.tasks.find(t => t.id === taskId);
      const values = {
        id: schedule ? schedule.id : makeId(), title,
        category: $('taskCategory').value || currentCategory,
        day: $('monthlyDay').value, monthOffset: $('monthlyOffset').value,
        startDate: schedule ? schedule.startDate : $('monthlyStart').value,
        active: schedule ? schedule.active : true,
        lastGeneratedMonth: schedule ? schedule.lastGeneratedMonth : ''
      };
      const normalized = HanamaruRecurrence.normalizeSchedule(values, todayISO());
      if (schedule) Object.assign(schedule, normalized);
      else { schedule = normalized; state.monthlySchedules.push(schedule); }
      // Converting an existing card adopts its original month, including its completion.
      if (old && !scheduleId) {
        const month = schedule.startDate.slice(0, 7);
        const wasStamped = old.kind === 'repeat' && old.stampedPeriods?.[periodKey(old)];
        if (wasStamped) {
          state.tasks = state.tasks.filter(t => t.id !== old.id);
          delete state.taskGroups?.[old.id];
        } else {
          old.kind = 'single';
          old.monthlyScheduleId = schedule.id;
          old.occurrenceMonth = month;
          old.nextOccurrenceDate = '';
          old.startKind = 'dated';
          old.startDate = HanamaruRecurrence.occurrenceDate(month, schedule.day);
          old.dueKind = 'anytime';
          old.dueDate = '';
        }
        schedule.lastGeneratedMonth = month;
      }
      state.taskGroups = state.taskGroups || {};
      state.tasks.filter(t => t.monthlyScheduleId === schedule.id).forEach(t => {
        if (!t.completed || !scheduleId) {
          t.title = HanamaruRecurrence.monthlyTitle(schedule, t.occurrenceMonth);
          t.category = schedule.category;
          // Already issued cards stay available when the monthly day is edited.
        }
        state.taskGroups[t.id] = { groupId: `monthly_${schedule.id}`, groupTitle: schedule.title };
      });
      currentCategory = schedule.category;
      save();
      showPage('list');
      render();
      toast('月次札の設定を保存した。');
    }

    function renderMonthlySchedules() {
      const box = $('monthlyScheduleList');
      box.innerHTML = '';
      state.monthlySchedules.forEach(schedule => {
        const row = document.createElement('div');
        row.className = 'card controls';
        const label = document.createElement('div');
        label.className = 'task-title';
        label.textContent = schedule.title;
        const info = document.createElement('div');
        info.className = 'subtext';
        info.textContent = `${schedule.category} / 毎月${schedule.day}日から / ${schedule.monthOffset === -1 ? '前月分' : '当月分'}${schedule.active ? '' : ' / 発生停止中'}`;
        const buttons = document.createElement('div');
        buttons.className = 'row wrap';
        const edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'btn small'; edit.textContent = '編集';
        edit.onclick = () => { closeModal('settingsModal'); openTaskForm('', schedule.id); };
        const pause = document.createElement('button');
        pause.type = 'button'; pause.className = 'btn small';
        pause.textContent = schedule.active ? '今後の発生を停止' : '今月から再開';
        pause.onclick = () => {
          schedule.active = !schedule.active;
          if (schedule.active) {
            const previous = HanamaruRecurrence.addMonths(todayISO(nowShiftedDate()).slice(0, 7) + '-01', -1).slice(0, 7);
            if (!schedule.lastGeneratedMonth || schedule.lastGeneratedMonth < previous) schedule.lastGeneratedMonth = previous;
          }
          save(); render();
        };
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'btn small danger'; del.textContent = '削除';
        del.onclick = () => confirmDeleteMonthlySchedule(schedule.id);
        buttons.append(edit, pause, del); row.append(label, info, buttons); box.appendChild(row);
      });
      if (!state.monthlySchedules.length) box.textContent = '月次札なし。札を貼る → 種類「月次」で登録できる。';
    }


    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      if (isFutureTask(task)) { toast('開始日前の札。まだ待機。'); return; }
      if (task.kind === 'repeat' && task.stampedPeriods?.[periodKey(task)]) { toast('花丸に変換済み。取り消すときはUndo。'); return; }
      task.completed = !task.completed;
      task.completedAt = task.completed ? new Date().toISOString() : null;
      if (task.kind === 'repeat') {
        task.repeatSchema = 1;
        task.nextOccurrenceDate = task.completed ? HanamaruRecurrence.nextDate(todayISO(new Date(task.completedAt)), task) : '';
      }
      save();
      render();
    }


    function reviveRepeatTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task || task.kind !== 'repeat' || (!task.completed && !isFutureTask(task))) return;
      if (task.completed && !task.stampedPeriods?.[periodKey(task)]) {
        const archive = normalizeTask({
          ...task, id: makeId(), kind: 'single', repeatArchive: true,
          nextOccurrenceDate: '', startKind: 'now', startDate: ''
        });
        state.tasks.push(archive);
        if (state.taskGroups?.[task.id]) state.taskGroups[archive.id] = { ...state.taskGroups[task.id] };
      }
      task.completed = false;
      task.completedAt = null;
      task.nextOccurrenceDate = '';
      task.startKind = 'now';
      task.startDate = '';
      if (task.dueKind === 'dated') task.dueDate = todayISO(nowShiftedDate());
      task.repeatSchema = 1;
      task.repeatCycle = (Number(task.repeatCycle) || 0) + 1;
      task.activePeriodKey = `completion:${task.id}:${task.repeatCycle}`;
      task.sortOrder = Date.now();
      currentCategory = task.category;
      // An older whole-state Undo must not erase this new occurrence.
      lastUndo = null;
      $('undoBtn').disabled = true;
      save();
      showPage('list');
      render();
      toast('定期札を復活させた。次回は今回の完了日から数える。');
    }

    function deleteTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      if (!confirm(`「${task.title}」を剥がして捨てる？${task.monthlyScheduleId ? '\nこの月の札だけを削除する。毎月の発生は設定から停止できる。' : ''}`)) return;
      state.tasks = state.tasks.filter(t => t.id !== id);
      if (state.taskGroups) delete state.taskGroups[id];
      save();
      render();
    }

    function deleteMonthlySchedule(id, removeCards = false) {
      if (!state.monthlySchedules.some(s => s.id === id)) return;
      state.monthlySchedules = state.monthlySchedules.filter(s => s.id !== id);
      const related = state.tasks.filter(t => t.monthlyScheduleId === id);
      if (removeCards) {
        const ids = new Set(related.map(t => t.id));
        state.tasks = state.tasks.filter(t => !ids.has(t.id));
        related.forEach(t => { if (state.taskGroups) delete state.taskGroups[t.id]; });
      } else {
        related.forEach(t => { t.monthlyScheduleId = ''; t.occurrenceMonth = ''; });
      }
      lastUndo = null;
      $('undoBtn').disabled = true;
      save();
      showPage('list');
      render();
      toast(removeCards ? '月次設定と残っていた札を削除した。' : '月次設定を削除した。残っていた札はそのまま。');
    }

    function confirmDeleteMonthlySchedule(id) {
      const schedule = state.monthlySchedules.find(s => s.id === id);
      if (!schedule) return;
      let modal = $('deleteMonthlyModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'deleteMonthlyModal';
        modal.className = 'modal-backdrop';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-labelledby', 'deleteMonthlyTitle');
        modal.innerHTML = '<div class="modal"><div class="modal-head"><h2 id="deleteMonthlyTitle">月次設定を削除</h2></div><p id="deleteMonthlyText"></p><label class="row"><input id="deleteMonthlyCards" type="checkbox" style="width:auto;min-height:0" />残っている月別の札も削除する</label><p class="subtext">チェックを外すと、今ある札を残して毎月の発生を終了する。獲得済みの花丸と履歴は残る。</p><div class="row wrap"><button id="deleteMonthlyYes" class="btn danger" type="button">削除する</button><button id="deleteMonthlyCancel" class="btn" type="button">キャンセル</button></div></div>';
        document.body.appendChild(modal);
        modal.addEventListener('click', event => { if (event.target === modal) closeModal('deleteMonthlyModal'); });
      }
      $('deleteMonthlyText').textContent = `「${schedule.title}」の月次設定を削除する？`;
      $('deleteMonthlyCards').checked = false;
      $('deleteMonthlyCancel').onclick = () => closeModal('deleteMonthlyModal');
      $('deleteMonthlyYes').onclick = () => {
        const removeCards = $('deleteMonthlyCards').checked;
        closeModal('deleteMonthlyModal');
        closeModal('settingsModal');
        deleteMonthlySchedule(id, removeCards);
      };
      openModal('deleteMonthlyModal');
    }

    function deleteFromEdit() {
      const scheduleId = $('monthlyScheduleId').value;
      if (scheduleId) { confirmDeleteMonthlySchedule(scheduleId); return; }
      const id = $('taskId').value;
      if (!id) return;
      deleteTask(id);
      if (!state.tasks.some(t => t.id === id)) showPage('list');
    }

    function convertibleTasks() {
      return state.tasks.filter(task => {
        if (!task.completed || isFutureTask(task)) return false;
        if (task.kind === 'single') return true;
        const key = periodKey(task);
        return !(task.stampedPeriods && task.stampedPeriods[key]);
      });
    }

    function updateConvertButton() {
      const count = convertibleTasks().length;
      $('convertBtn').textContent = count ? `変換 ${count}` : '変換';
      $('convertBtn').disabled = count === 0;
    }

    function confirmConversion(targets) {
      return new Promise(resolve => {
        let modal = $('confirmConvertModal');
        if (!modal) {
          modal = document.createElement('div');
          modal.className = 'modal-backdrop';
          modal.id = 'confirmConvertModal';
          modal.innerHTML = `<div class="modal"><div class="modal-head"><h2>花丸に変換する札</h2><button class="btn small ghost" id="confirmConvertCancelTop" type="button">閉じる</button></div><p class="subtext">完了札を確認。変換すると単発は消え、定期札は完了日から次回を待つ。</p><div class="confirm-list" id="confirmConvertList"></div><div class="row wrap"><button class="btn primary" id="confirmConvertYes" type="button">変換</button><button class="btn" id="confirmConvertNo" type="button">キャンセル</button></div></div>`;
          document.body.appendChild(modal);
          modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('show'); });
        }
        $('confirmConvertList').innerHTML = targets.map(t => `<div class="confirm-item">・${escapeHtml(t.title)}</div>`).join('');
        const finish = result => { modal.classList.remove('show'); resolve(result); };
        $('confirmConvertYes').onclick = () => finish(true);
        $('confirmConvertNo').onclick = () => finish(false);
        $('confirmConvertCancelTop').onclick = () => finish(false);
        modal.classList.add('show');
      });
    }

    function milestoneFor(total) {
      const list = [
        { n: 10, title: '芽吹き札', msg: '枯れ枝に最初の芽。' },
        { n: 30, title: '小花係', msg: '小さい花が増えてきた。' },
        { n: 50, title: '花丸職人', msg: '花丸の手つきが安定。' },
        { n: 100, title: '百花丸', msg: '100個到達。約束のご褒美圏。' },
        { n: 300, title: '満開管理人', msg: 'かなり咲いている。' },
        { n: 500, title: '花畑所有者', msg: 'もう庭がある。' },
        { n: 1000, title: '千輪花丸', msg: '桁がおかしい。良い意味で。' }
      ];
      return list.filter(item => total >= item.n).at(-1) || null;
    }

    async function convertCompleted() {
      const targets = convertibleTasks();
      if (!targets.length) { toast('花丸にする完了札がない。'); return; }
      const ok = await confirmConversion(targets);
      if (!ok) return;
      lastUndo = JSON.stringify(state);
      const now = new Date().toISOString();
      const spentBefore = Array.isArray(state.rewardHistory) ? state.rewardHistory.reduce((sum, item) => sum + (Number(item.cost) || 0), 0) : 0;
      const earnedBefore = Math.max(Number(state.earnedTotal) || 0, (Number(state.totalStamps) || 0) + spentBefore);
      lastConvertedItems = targets.map(t => ({ ...t }));
      targets.forEach(task => {
        if (task.kind === 'repeat') {
          const key = periodKey(task);
          task.stampedPeriods = task.stampedPeriods || {};
          task.stampedPeriods[key] = now;
          task.activePeriodKey = key;
          task.completed = true;
          task.completedAt = task.completedAt || now;
        }
      });
      const removeIds = new Set(targets.filter(t => t.kind === 'single').map(t => t.id));
      state.tasks = state.tasks.filter(t => !removeIds.has(t.id));
      state.totalStamps += targets.length;
      const spentAfter = Array.isArray(state.rewardHistory) ? state.rewardHistory.reduce((sum, item) => sum + (Number(item.cost) || 0), 0) : 0;
      state.earnedTotal = Math.max(Number(state.earnedTotal) || 0, state.totalStamps + spentAfter, earnedBefore + targets.length);
      const unlocked = milestoneFor(state.earnedTotal);
      const beforeUnlocked = milestoneFor(earnedBefore);
      save();
      const outputText = buildOutput(targets);
      state.conversionHistory.unshift({ id: makeId(), createdAt: now, count: targets.length, items: targets.map(t => t.title), text: outputText, balanceAfter: state.totalStamps, earnedTotalAfter: state.earnedTotal });
      state.conversionHistory = state.conversionHistory.slice(0, 3);
      save();
      $('undoBtn').disabled = false;
      showStamp();
      showOutput(targets);
      render();
      if (unlocked && (!beforeUnlocked || unlocked.n !== beforeUnlocked.n)) setTimeout(() => toast(`称号「${unlocked.title}」獲得。${unlocked.msg}`), 900);
    }

    function undoConvert() {
      if (!lastUndo) return;
      const restored = normalizeState(JSON.parse(lastUndo));
      Object.keys(state).forEach(key => delete state[key]);
      Object.assign(state, restored);
      lastUndo = null;
      lastConvertedItems = [];
      $('undoBtn').disabled = true;
      save();
      render();
      toast('直前の花丸変換を戻した。');
    }

    function buildOutput(items = lastConvertedItems) {
      const itemText = items.map(t => `・${t.title}`).join('\n');
      const template = $('templateBox') && $('templateBox').value ? $('templateBox').value : state.settings.outputTemplate || DEFAULT_TEMPLATE;
      return template.replaceAll('{{items}}', itemText).replaceAll('{{count}}', String(items.length)).replaceAll('{{total}}', String(state.totalStamps)).replaceAll('{{category}}', currentCategory).replaceAll('{{date}}', todayISO());
    }

    function showOutput(items) {
      $('templateBox').value = state.settings.outputTemplate || DEFAULT_TEMPLATE;
      $('convertSummary').textContent = `${items.length}枚の札を花丸に変換。`;
      $('outputBox').value = buildOutput(items);
      renderHistory($('historyInOutput'));
      openModal('outputModal');
    }

    function saveTemplate() {
      state.settings.outputTemplate = $('templateBox').value || DEFAULT_TEMPLATE;
      $('outputBox').value = buildOutput();
      save();
      toast('テンプレートを保存。');
    }

    function renderHistory(container) {
      container.innerHTML = '';
      const rewardHistory = Array.isArray(state.rewardHistory) ? state.rewardHistory : [];
      const spentTotal = rewardHistory.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
      const earnedTotal = Math.max(Number(state.earnedTotal) || 0, (Number(state.totalStamps) || 0) + spentTotal);
      const currentMilestone = milestoneFor(earnedTotal);
      const nextMilestone = [10, 30, 50, 100, 300, 500, 1000].find(n => n > earnedTotal);
      const bloom = earnedTotal >= 1000 ? '🌸🌸🌸🌳🌸🌸🌸' : earnedTotal >= 500 ? '🌸🌸🌳🌸🌸' : earnedTotal >= 300 ? '🌸🌳🌸' : earnedTotal >= 100 ? '🌸🌳' : earnedTotal >= 30 ? '🌱🌳' : '枯れ木 🌳';
      const summary = document.createElement('div');
      summary.className = 'card achievement-card';
      summary.style.margin = '0';
      summary.innerHTML = `<div class="achievement-tree">${bloom}</div><div class="task-title">${currentMilestone ? '称号：' + escapeHtml(currentMilestone.title) : '称号：芽待ち'}</div><div class="subtext">獲得累計 ${earnedTotal} / 消費累計 ${spentTotal} / 現在 ${state.totalStamps}</div><div class="subtext">${currentMilestone ? escapeHtml(currentMilestone.msg) : 'まずは10花丸で芽吹き。'}${nextMilestone ? ' 次は' + nextMilestone + '花丸。' : ' 到達称号はひとまず全開放。'}</div>`;
      container.appendChild(summary);
      if (state.conversionHistory.length) {
        const head = document.createElement('h3');
        head.textContent = '直近の変換';
        container.appendChild(head);
        state.conversionHistory.slice(0, 3).forEach((entry, index) => {
          const box = document.createElement('div');
          box.className = 'card';
          box.style.margin = '0';
          const title = document.createElement('div');
          title.className = 'task-title';
          title.textContent = `${index + 1}. ${formatDateTime(entry.createdAt)} / +${entry.count}枚`;
          const text = document.createElement('textarea');
          text.value = entry.text;
          const copy = document.createElement('button');
          copy.type = 'button';
          copy.className = 'btn primary';
          copy.textContent = 'この履歴をコピー';
          copy.addEventListener('click', () => copyText(entry.text, '履歴をコピー。'));
          box.append(title, text, copy);
          container.appendChild(box);
        });
      }
      const rewardHead = document.createElement('h3');
      rewardHead.textContent = '消費ログ';
      container.appendChild(rewardHead);
      if (!rewardHistory.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '消費ログなし。';
        container.appendChild(empty);
        return;
      }
      rewardHistory.slice(0, 10).forEach(entry => {
        const box = document.createElement('div');
        box.className = 'card reward-log';
        box.style.margin = '0';
        box.innerHTML = `<div class="task-title">-${Number(entry.cost) || 0} 花丸</div><div class="subtext">${formatDateTime(entry.createdAt)}</div><div>${escapeHtml(entry.title || 'ご褒美')}</div>`;
        container.appendChild(box);
      });
    }

    function formatDateTime(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '';
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function copyText(text, label = 'コピーした。') {
      try { await navigator.clipboard.writeText(text); toast(label); }
      catch (error) { console.warn(error); toast('コピー失敗。テキスト欄を長押しで選択して使う。'); }
    }

    function showStamp() {
      const pop = $('stampPop');
      pop.classList.remove('show');
      void pop.offsetWidth;
      pop.classList.add('show');
      setTimeout(() => pop.classList.remove('show'), 950);
    }

    function renderSettingsManage() {
      $('visibleLimit').value = state.settings.visibleLimit;
      $('recommendCount').value = state.settings.recommendCount;
      $('resetHour').value = state.settings.resetHour;
      const box = $('categoryManage');
      box.innerHTML = '';
      state.categories.forEach(category => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `btn small ${category === currentCategory ? 'primary' : ''}`;
        btn.textContent = category;
        btn.addEventListener('click', () => { currentCategory = category; render(); });
        box.appendChild(btn);
      });
    }

    function saveSettings() {
      state.settings.visibleLimit = Math.max(1, Number($('visibleLimit').value) || 5);
      state.settings.recommendCount = Math.max(0, Number($('recommendCount').value) || 0);
      state.settings.resetHour = $('resetHour').value || '05:00';
      state.recommendations = {};
      save();
      render();
      toast('設定保存。');
    }

    function addCategory() {
      const value = $('categoryInput').value.trim();
      if (!value) return;
      if (!state.categories.includes(value)) state.categories.push(value);
      currentCategory = value;
      $('categoryInput').value = '';
      save();
      render();
    }

    function exportJson() {
      const text = JSON.stringify(state, null, 2);
      $('jsonBox').value = text;
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hanamaru-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('JSONを書き出した。');
    }

    function importJson() {
      try {
        const parsed = normalizeState(JSON.parse($('jsonBox').value));
        if (!confirm('今のローカルデータを、貼ったJSONで置き換える。実行する？')) return;
        Object.keys(state).forEach(key => delete state[key]);
        Object.assign(state, parsed);
        currentCategory = state.categories[0];
        save();
        render();
        toast('JSONを読み込んだ。');
      } catch (error) {
        console.warn(error);
        toast('JSONとして読めない。括弧かカンマが崩れている可能性。');
      }
    }

    function makeAiPrompt() {
      const source = $('aiSourceTask').value.trim() || 'ここに細分化したいタスクを書く';
      $('aiPromptBox').value = `次のタスクを、花丸札アプリに貼れる小さい札へ分解して。\n\n対象：${source}\n\n条件：\n・3〜7分でできる粒度にする\n・判断が必要な札と、手を動かすだけの札を分ける\n・最初の一手をかなり小さくする\n・普通のToDoではなく「頭の中の札を剥がす」感じにする\n・出力は下のタグ形式だけにする\n\n形式：\n[カテゴリ][単発][いつでも] タスク名\n[カテゴリ][単発][開始日:YYYY-MM-DD][いつでも] タスク名\n[カテゴリ][繰り返し:3日][いつでも] タスク名\n[カテゴリ][繰り返し:2週][期限あり:YYYY-MM-DD] タスク名\n\nカテゴリ候補：${state.categories.join('、')}`;
    }

    function parseAiLines() {
      const lines = $('aiImportBox').value.split('\n').map(line => line.trim()).filter(Boolean);
      const tasks = [];
      const tagPattern = /\[([^\]]+)\]/g;
      for (const line of lines) {
        const tags = [...line.matchAll(tagPattern)].map(m => m[1].trim());
        const title = line.replace(tagPattern, '').trim();
        if (tags.length < 3 || !title) continue;
        const category = tags[0];
        const kindTag = tags.find(t => t === '単発' || t.startsWith('繰り返し')) || '単発';
        const startTag = tags.find(t => /^開始日[:：]\d{4}-\d{2}-\d{2}$/.test(t));
        const dueTag = tags.find(t => t === 'いつでも' || /^期限あり[:：]\d{4}-\d{2}-\d{2}$/.test(t)) || 'いつでも';
        const repeat = repeatFromTag(kindTag);
        const kind = repeat ? 'repeat' : 'single';
        const dueDateMatch = dueTag.match(/^期限あり[:：](\d{4}-\d{2}-\d{2})$/);
        const startDateMatch = startTag ? startTag.match(/^開始日[:：](\d{4}-\d{2}-\d{2})$/) : null;
        tasks.push(normalizeTask({
          category,
          kind,
          repeatEvery: repeat ? repeat.unit : 'day',
          repeatInterval: repeat ? repeat.interval : 1,
          startKind: startDateMatch ? 'dated' : 'now',
          startDate: startDateMatch ? startDateMatch[1] : '',
          dueKind: dueDateMatch ? 'dated' : 'anytime',
          dueDate: dueDateMatch ? dueDateMatch[1] : '',
          title
        }));
      }
      return tasks;
    }

    function repeatFromTag(tag) {
      if (!tag.startsWith('繰り返し')) return null;
      const match = tag.match(/繰り返し[:：]?\s*(\d+)?\s*([日週月年])?/);
      const interval = Math.max(1, Number(match && match[1] ? match[1] : 1));
      const unitChar = match && match[2] ? match[2] : '日';
      const unit = { '日': 'day', '週': 'week', '月': 'month', '年': 'year' }[unitChar] || 'day';
      return { interval, unit };
    }

    function previewAiTasks() {
      const tasks = parseAiLines();
      $('aiParseResult').innerHTML = tasks.length
        ? tasks.map(t => `・${escapeHtml(t.category)} / ${t.kind === 'repeat' ? escapeHtml(repeatHuman(t)) : '単発'} / ${t.startKind === 'dated' ? `開始 ${escapeHtml(t.startDate)} / ` : ''}${t.dueKind === 'dated' ? `期限 ${escapeHtml(t.dueDate)}` : 'いつでも'}：${escapeHtml(t.title)}`).join('<br>')
        : '取り込める札がない。タグの括弧を確認。';
      return tasks;
    }

    function repeatHuman(task) {
      const n = Math.max(1, Number(task.repeatInterval) || 1);
      const unit = { day: '日', week: '週間', month: 'か月', year: '年' }[task.repeatEvery] || '日';
      return `完了から${n}${unit}後`;
    }


    function importAiTasks() {
      const tasks = previewAiTasks();
      if (!tasks.length) return;
      const newCategories = tasks.map(t => t.category).filter(c => !state.categories.includes(c));
      state.categories.push(...uniqueClean(newCategories));
      tasks.forEach(task => {
        if (task.kind === 'repeat') task.activePeriodKey = periodKey(task);
        if (task.dueKind === 'anytime') task.sortOrder = Date.now();
      });
      state.tasks.push(...tasks);
      currentCategory = tasks[0].category;
      save();
      render();
      closeModal('aiModal');
      toast(`${tasks.length}枚取り込んだ。`);
    }

    function escapeHtml(text) { return String(text).replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c])); }
    function openModal(id) { $(id).classList.add('show'); }
    function closeModal(id) { $(id).classList.remove('show'); }

    let toastTimer = null;
    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function bindEvents() {
      $('newTaskBtn').addEventListener('click', () => openTaskForm(''));
      $('cancelEdit').addEventListener('click', () => showPage('list'));
      $('taskForm').addEventListener('submit', saveTaskFromForm);
      $('deleteFromEdit').addEventListener('click', deleteFromEdit);
      $('reviveFromEdit').addEventListener('click', () => reviveRepeatTask($('taskId').value));
      $('taskKind').addEventListener('change', syncFormVisibility);
      $('startKind').addEventListener('change', syncFormVisibility);
      $('dueKind').addEventListener('change', syncFormVisibility);
      $('refreshReco').addEventListener('click', () => refreshRecommendations(true));
      $('convertBtn').addEventListener('click', convertCompleted);
      $('undoBtn').addEventListener('click', undoConvert);
      $('openSettings').addEventListener('click', () => openModal('settingsModal'));
      $('openAiTools').addEventListener('click', () => { makeAiPrompt(); openModal('aiModal'); });
      $('openHistory').addEventListener('click', () => { renderHistory($('historyList')); openModal('historyModal'); });
      document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.close)));
      document.querySelectorAll('.modal-backdrop').forEach(backdrop => backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(backdrop.id); }));
      $('saveSettings').addEventListener('click', saveSettings);
      $('addCategory').addEventListener('click', addCategory);
      $('exportJson').addEventListener('click', exportJson);
      $('copyJson').addEventListener('click', () => copyText($('jsonBox').value || JSON.stringify(state, null, 2), 'JSONをコピー。'));
      $('importJson').addEventListener('click', importJson);
      $('saveTemplate').addEventListener('click', saveTemplate);
      $('templateBox').addEventListener('input', () => $('outputBox').value = buildOutput());
      $('copyOutput').addEventListener('click', () => copyText($('outputBox').value, '出力文をコピー。'));
      $('makeAiPrompt').addEventListener('click', makeAiPrompt);
      $('copyAiPrompt').addEventListener('click', () => copyText($('aiPromptBox').value, 'AI依頼文をコピー。'));
      $('parseAiTasks').addEventListener('click', previewAiTasks);
      $('importAiTasks').addEventListener('click', importAiTasks);
    }

    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
    bindEvents();
    render();
    function refreshCalendar() {
      if (!document.hidden && $('editPage').classList.contains('hidden') && !document.querySelector('.modal-backdrop.show') && currentDayKey() !== renderedDay) render();
    }
    document.addEventListener('visibilitychange', refreshCalendar);
    setInterval(refreshCalendar, 60000);
  </script>
